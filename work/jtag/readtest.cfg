# JTAG memory-read acceptance test against KNOWN-TRUTH flash bytes.
#
# Ground truth (read out of JV6T-14C094-AD.VBF, which we just flashed into
# THIS unit, so it is what the silicon now holds):
#
#     0x000DE278 : 70e8e000 30e719c4 90730143 000470e8
#     0x000FC2C2 : 5cea0000 51840008 01433084 001ee80e
#     0x00062848 : 0080780a b73b7008 e0001c00 4d6ea070
#
# Previously mdw returned 0x00000000 for EVERY address, and `reg` showed PC
# and all 32 GPRs as 0x00000000 "(dirty)" - i.e. the register cache was never
# populated from silicon.  That is a broken read path, NOT erased flash and
# NOT censorship (OnCE OSR tracks debug enter/exit; dbcr0/dbsr read as 0).
#
# ⚠ SAFETY - learned the hard way: a previous session left the core halted at
# process exit and the ECU went silent on CAN until a power cycle.  `resume`
# is issued before `exit` here, unconditionally.  Do not remove it.

init
halt

echo ""
echo "=== KNOWN-TRUTH READ TEST ==="
echo "--- 0x000DE278 expect: 70e8e000 30e719c4 90730143 000470e8"
mdw 0x000de278 4
echo "--- 0x000FC2C2 expect: 5cea0000 51840008 01433084 001ee80e"
mdw 0x000fc2c2 4
echo "--- 0x00062848 expect: 0080780a b73b7008 e0001c00 4d6ea070"
mdw 0x00062848 4
echo "--- SRAM 0x40000000 (no truth, just look for non-zero)"
mdw 0x40000000 4

echo ""
echo "=== core registers (PC must NOT be 0 on a halted running ECU) ==="
reg pc
reg msr

echo ""
echo "=== RESUME (mandatory - do not leave the core halted) ==="
resume
echo "=== resumed ==="
exit
