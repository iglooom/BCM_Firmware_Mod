# Scan-length integrity test — STOCK OpenOCD + the CURRENT v1/HID firmware.
#
# WHY THIS EXISTS (a confound in my earlier conclusion):
#
#   The verdict "the calandoa fork's CMSIS-DAP driver corrupts JTAG scans" came
#   from comparing:
#       fork   + v1/HID firmware  -> BYPASS shift FAILS at every length
#       stock  + v2/bulk firmware -> BYPASS shift PASSES
#   That changes TWO variables at once (host driver AND probe firmware), so it
#   does NOT isolate the cause.  And we have since PROVEN this firmware had a
#   serious bug in DAP_SWJ_Pins (GPIO-number vs protocol-bit indexing), which
#   makes "maybe its v1/HID JTAG path is also wrong" a live hypothesis rather
#   than a stretch.
#
#   This config holds the firmware FIXED at the current v1/HID build and swaps
#   only the host:  stock OpenOCD 0.12.
#
#       stock + v1/HID PASSES -> the fork's driver is the culprit.
#                                Port xpc56.c onto stock OpenOCD.
#       stock + v1/HID FAILS  -> the PROBE's v1/HID JTAG path is the culprit.
#                                Fix the firmware; the fork may then be fine.
#
# Ground truth is arithmetic, not silicon: BYPASS is a 1-bit register that
# delays by exactly one TCK, so out == (in << 1) masked to the scan length.
#
# SAFE: stock OpenOCD has no e200 target driver, so it cannot halt the core.
# This only shifts bits through the TAP.
#
# Run:
#   openocd -f work/jtag/scanlen_stock.cfg

adapter driver cmsis-dap
transport select jtag
adapter speed 1000

jtag newtap mpc5607b cpu -irlen 5 -expected-id 0x4ae43041

init

proc bit_test {len inhex} {
    irscan mpc5607b.cpu 0x1F
    set out [drscan mpc5607b.cpu $len $inhex]
    set inv  [expr {"0x$inhex"}]
    set outv [expr {"0x$out"}]
    set mask [expr {(1 << $len) - 1}]
    set expect [expr {($inv << 1) & $mask}]
    if {$outv == $expect} {
        echo [format "   %3d bits: in=%s out=%s  OK" $len $inhex $out]
    } else {
        echo [format "   %3d bits: in=%s out=%s  *** MISMATCH, expected %x ***" $len $inhex $out $expect]
    }
}

echo ""
echo "=== STOCK OpenOCD + current v1/HID firmware: BYPASS shift ==="
echo "    (ground truth: out == in<<1 at every length)"
bit_test 8   5A
bit_test 16  5A5A
bit_test 32  5A5A5A5A
bit_test 64  5A5A5A5A5A5A5A5A
bit_test 96  5A5A5A5A5A5A5A5A5A5A5A5A
bit_test 128 5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A
bit_test 192 5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A

echo ""
echo "=== IDCODE re-read (control: the link is still sane) ==="
irscan mpc5607b.cpu 0x01
echo "   IDCODE = [drscan mpc5607b.cpu 32 0]"
echo "=== done ==="
shutdown
