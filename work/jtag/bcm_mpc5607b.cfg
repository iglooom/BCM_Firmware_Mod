# JTAG bring-up: Lonehog / Raspberry Pi "JTAG probe on Pico" (CMSIS-DAP v2)
#   -> Ford BCM bench unit #2, MPC5607B (Bolero, e200z0)
#
# STATUS: link PROVEN.  TAP answers IDCODE 0x4AE43041 (ST, part 0xAE43, ver 4).
#
# WHY THERE IS NO `target create`:
# OpenOCD 0.12 has NO PowerPC e200 / Nexus target driver.  `transport select
# jtag` gives raw scan-chain access and nothing more - no halt, no register
# read, no memory read.  This config therefore only exercises the scan chain.
# Anything beyond that needs a different tool (see docs/jtag_bringup.md §5).
#
# THIS BUILD'S QUIRK: `cmsis-dap backend usb_bulk` and `cmsis-dap vid_pid` are
# NOT commands here - this OpenOCD exposes only `cmsis-dap cmd` and
# `cmsis-dap info`.  Passing them prints the subcommand help and continues,
# which looks like a config error but is harmless.  Autodetection finds the
# probe on its own, so they are simply omitted.
#
# Run:  openocd -f work/jtag/bcm_mpc5607b.cfg

adapter driver cmsis-dap
transport select jtag

# 100 kHz for first contact over ECU harness leads; see §4 for the speed sweep.
adapter speed 100

# MPC560xB JTAGC: 5-bit IR, IDCODE opcode 0x01, BYPASS 0x1F.
jtag newtap mpc5607b cpu -irlen 5 -expected-id 0x4ae43041

init

proc idcode_once {} {
    # After TLR the TAP auto-loads IDCODE, but load it explicitly so this works
    # from any state.
    irscan mpc5607b.cpu 0x01
    return [drscan mpc5607b.cpu 32 0]
}

proc verify_link {n} {
    # Repeatability is what separates a real link from a lucky floating read.
    set first ""
    set bad 0
    for {set i 0} {$i < $n} {incr i} {
        set id [idcode_once]
        if {$first eq ""} { set first $id }
        if {$id ne $first} {
            echo "  MISMATCH on read $i: 0x$id (expected 0x$first)"
            incr bad
        }
    }
    echo "  $n reads, [expr {$n - $bad}] identical, value 0x$first"
    if {$bad == 0} {
        echo "  -> STABLE"
    } else {
        echo "  -> UNSTABLE: $bad differing read(s).  Lower adapter speed."
    }
    return $first
}

proc bypass_check {} {
    # Strong independent proof the TAP is real: load BYPASS (all ones) and shift
    # a known pattern through the 1-bit bypass register.  A floating/stuck line
    # cannot reproduce a shifted pattern.
    #
    # MEASURED: in 0xA5A5A5A5 -> out 0x4B4B4B4A, which is exactly (in << 1).
    # JTAG shifts LSB-first, so the 1-cycle bypass delay shows up as a LEFT
    # shift when the word is printed MSB-first: the top bit is dropped and a 0
    # enters at the bottom.  (An earlier comment here predicted a RIGHT shift /
    # 0x52D2D2D2 - that was wrong about the bit order.)
    irscan mpc5607b.cpu 0x1F
    set out [drscan mpc5607b.cpu 32 0xA5A5A5A5]
    echo "  BYPASS: shifted in 0xA5A5A5A5, got back 0x$out"
    echo "  (expected 0x4b4b4b4a = input << 1; 31 of 32 bits round-tripped)"
    return $out
}
