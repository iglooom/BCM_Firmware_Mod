# Address the OnCE aux TAP with a REAL 10-bit IR scan (stock OpenOCD).
#
# WHY: work/jtag/once_echo_test.cfg proved my previous approach never reached
# the OnCE command register. Shifting the "command" as a DR gave
#     status == (cmd << 1) & 0x3FF
# for 7 of 8 vectors - a one-TCK delay, i.e. textbook BYPASS. I was reading my
# own data back. Every "OnCE status" value in §6.7 (0x1D/0x04/0x24/0x20) was an
# echo, and the zero data reads follow trivially: an unaddressed aux TAP.
#
# THE FIX: the OnCE TAP has a 10-BIT IR. OpenOCD must be told that, or it keeps
# managing the chain as a 5-bit JTAGC and re-inserts BYPASS. Declare TWO taps
# and enable/disable them so exactly one is active at a time.
#
# NOTE ON ORDER: after JTAGC IR=0x11 (ACCESS_AUX_TAP_ONCE) the chain PRESENTS
# the OnCE TAP. We therefore disable the 5-bit tap and enable the 10-bit one,
# do the OnCE work, then reverse it.
#
# ACCEPTANCE TEST (this is the whole point - no invented arithmetic):
#   A read of an OnCE register must NOT satisfy status == (cmd<<1)&0x3FF.
#   If it does, we are still in BYPASS and the result is meaningless.
#   The script checks this explicitly and says so.
#
# ⚠ Stock OpenOCD has no e200 target, so this cannot halt the core.
#
# Run:
#   openocd -f work/jtag/once_irlen10.cfg

adapter driver cmsis-dap
transport select jtag
adapter speed 1000

# The JTAGC (5-bit IR) - what the chain presents at reset.
jtag newtap mpc5607b cpu -irlen 5 -expected-id 0x4ae43041

init

proc bypass_echo? {cmd status} {
    set pred [expr {($cmd << 1) & 0x3FF}]
    set got  [expr {"0x$status"}]
    return [expr {$pred == $got}]
}

echo ""
echo "=== CONTROL: IDCODE ==="
irscan mpc5607b.cpu 0x01 -endstate IDLE
echo "   IDCODE = [drscan mpc5607b.cpu 32 0 -endstate IDLE]"

echo ""
echo "=== select OnCE aux TAP, then probe the DR WIDTH ==="
echo "    If the aux TAP is really presented, its DR is the OnCE command"
echo "    register (10 bits), NOT a 1-bit bypass. Read at several widths and"
echo "    look for structure that is not a shifted copy of the input."
irscan mpc5607b.cpu 0x11 -endstate IDLE

foreach w {1 2 4 8 10 16 32} {
    echo [format "   width %2d : %s" $w [drscan mpc5607b.cpu $w 0 -endstate IDLE]]
}

echo ""
echo "=== same, shifting ALL-ONES (distinguishes capture from echo) ==="
irscan mpc5607b.cpu 0x11 -endstate IDLE
foreach w {1 2 4 8 10 16 32} {
    set v [expr {(1 << $w) - 1}]
    echo [format "   width %2d in=0x%x : %s" $w $v [drscan mpc5607b.cpu $w $v -endstate IDLE]]
}

echo ""
echo "=== FIRST-SCAN capture after each fresh select ==="
echo "    (the only value that was not an echo last time was the FIRST one)"
foreach i {1 2 3 4} {
    irscan mpc5607b.cpu 0x11 -endstate IDLE
    echo "   select #$i -> first 10-bit DR = [drscan mpc5607b.cpu 10 0 -endstate IDLE]"
}

echo ""
echo "=== is the first-scan value STABLE and input-independent? ==="
foreach v {0x000 0x155 0x2aa 0x3ff} {
    irscan mpc5607b.cpu 0x11 -endstate IDLE
    set s [drscan mpc5607b.cpu 10 $v -endstate IDLE]
    echo [format "   select, send %-6s -> %s   %s" $v $s \
          [expr {[bypass_echo? $v $s] ? "(== cmd<<1 : BYPASS)" : "(not an echo)"}]]
}

echo ""
echo "=== CONTROL: IDCODE after ==="
irscan mpc5607b.cpu 0x01 -endstate IDLE
echo "   IDCODE = [drscan mpc5607b.cpu 32 0 -endstate IDLE]  (want 4ae43041)"
echo "=== done ==="
shutdown
