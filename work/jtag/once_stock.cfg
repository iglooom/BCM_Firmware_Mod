# Read OnCE registers via STOCK OpenOCD's proven scan engine.
#
# WHY NOT a hand-rolled DAP driver: my Python TAP walker returned 0x7FFFFFFF
# for IDCODE (a one-bit misalignment), so it failed its own control. Stock
# OpenOCD's scan engine is independently verified here (IDCODE correct at
# 32..256-bit lengths, 192 included, repeatable), so use it as the instrument.
#
# QUESTION: the fork WRITES the 192-bit CPUSCR chain correctly but every READ
# returns zeros. Is that specific to CPUSCR, or does the OnCE TAP refuse reads
# generally? DBCR0/DBSR are the positive control - the fork already prints
# sensible values for them, so they should read here too.
#
# ⚠ TAP-STATE CONSTRAINT (docs/jtag_bringup.md 4.1): on MPC56xx the JTAGC
# regains control during UPDATE-DR *if PAUSE-DR was entered*. OpenOCD's
# irscan/drscan end in the state given by -endstate. Using IDLE (RUN-TEST/IDLE)
# avoids PAUSE-DR, so an OnCE transaction is not torn down mid-sequence.
#
# SAFETY: pure scan activity, no target driver -> stock OpenOCD cannot halt the
# core. Verified: this config has no `target create`.
#
# Run:
#   openocd -f work/jtag/once_stock.cfg

adapter driver cmsis-dap
transport select jtag
adapter speed 1000

jtag newtap mpc5607b cpu -irlen 5 -expected-id 0x4ae43041

init

# --- helpers ---------------------------------------------------------------
# Select the OnCE auxiliary TAP, then load a 10-bit OnCE command.
# NOTE: after ACCESS_AUX_TAP_ONCE the chain presents a 10-bit IR, but OpenOCD
# still believes irlen=5. We therefore shift the OnCE command as a DR-style
# raw scan via `irscan` on the declared tap only for the JTAGC selection, and
# use drscan for everything below it.

proc jtagc_ir {v} {
    irscan mpc5607b.cpu $v -endstate IRPAUSE
}

proc show {label v} {
    echo [format "   %-28s %s" $label $v]
}

echo ""
echo "=== CONTROL: IDCODE via the declared TAP ==="
irscan mpc5607b.cpu 0x01 -endstate IDLE
show "IDCODE" [drscan mpc5607b.cpu 32 0 -endstate IDLE]

echo ""
echo "=== select OnCE aux TAP (JTAGC IR = 0x11) ==="
irscan mpc5607b.cpu 0x11 -endstate IDLE
echo "   selected."

echo ""
echo "=== OnCE register reads (10-bit cmd shifted as DR, then data DR) ==="
echo "    cmd = reg | 0x200 (RW=read).  DBCR0/DBSR are the positive control."

# OnCE command register is reached by an IR scan on the aux TAP. With OpenOCD
# holding irlen=5 we cannot irscan 10 bits, so shift the command through DR -
# on this part the aux TAP presents its command register in the DR path after
# selection. If this returns zeros for everything INCLUDING DBCR0, then the
# addressing approach is wrong (not the target).
foreach {name cmd width} {
    DBCR0  0x200  32
    DBSR   0x202  32
    OCR    0x212  32
    CPUSCR 0x210  192
} {
    set c [drscan mpc5607b.cpu 10 $cmd -endstate IDLE]
    set d [drscan mpc5607b.cpu $width 0 -endstate IDLE]
    show "$name (cmd=$cmd)" "cmd_ret=$c data=$d"
}

echo "=== done ==="
shutdown
