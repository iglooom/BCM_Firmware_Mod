# VALID scan-integrity test: IDCODE at increasing scan lengths.
#
# ⚠ WHY THE BYPASS TEST WAS ABANDONED
#   work/jtag/scanlen*.cfg asserted `out == in << 1` when shifting N bits
#   through BYPASS. That expectation was MY ASSUMPTION, not a derived truth:
#   BYPASS is a ONE-BIT register, so clocking 32/192 bits through it does not
#   yield a clean algebraic relation on the whole word - and the very first
#   "passing" measurement (0xA5A5A5A5 -> 0x4B4B4B4A) is a RIGHT shift, the
#   OPPOSITE direction from what the later test demanded. An instrument whose
#   expected value flips direction between runs cannot adjudicate anything, so
#   every "the scan engine is broken" verdict derived from it is withdrawn.
#
# THIS TEST INSTEAD uses a ground truth the silicon itself defines:
#   IDCODE is a 32-bit read-only register with a known value (0x4AE43041).
#   Reading it with a scan LONGER than 32 bits must return the IDCODE in the
#   low 32 bits (the TAP shifts in 1s/0s above it, hardware-defined), and the
#   value must be IDENTICAL at every length. If long scans were corrupted, the
#   low 32 bits would change with length. Nothing here depends on my algebra.
#
# Run:
#   openocd -f work/jtag/scanlen_idcode.cfg

adapter driver cmsis-dap
transport select jtag
adapter speed 1000

jtag newtap mpc5607b cpu -irlen 5 -expected-id 0x4ae43041

init

proc id_at {len} {
    irscan mpc5607b.cpu 0x01
    set out [drscan mpc5607b.cpu $len 0]
    # keep only the low 32 bits, whatever the scan length
    set low [expr {"0x$out" & 0xFFFFFFFF}]
    if {$low == 0x4ae43041} {
        echo [format "   %4d bits: low32=0x%08X  OK   (raw %s)" $len $low $out]
    } else {
        echo [format "   %4d bits: low32=0x%08X  *** WRONG *** (raw %s)" $len $low $out]
    }
}

echo ""
echo "=== IDCODE read at increasing scan lengths ==="
echo "    ground truth: low 32 bits must be 0x4AE43041 at EVERY length"
id_at 32
id_at 40
id_at 64
id_at 96
id_at 128
id_at 192
id_at 256

echo ""
echo "=== repeatability at 192 bits (the CPUSCR width) ==="
id_at 192
id_at 192
id_at 192

echo "=== done ==="
shutdown
