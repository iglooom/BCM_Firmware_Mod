# Is the "status" we capture a REAL OSR, or just an echo of what we shift in?
#
# Layer 6.7 recorded "the OnCE command scan returns real status (0x1D/0x04/
# 0x24/0x20)" and treated that as proof the TAP is alive. That inference is
# UNCONTROLLED: a shift register echoes its input, so those values could be
# remnants of the previous command rather than machine state.
#
# DISCRIMINATING TESTS (each has a definite prediction):
#
#  T1 REPEAT: send the SAME command twice in a row.
#       real OSR -> status stable (machine state unchanged)
#       echo     -> second read returns the first command's bits
#
#  T2 TRACK: send commands A,B,C and check whether status at step N equals
#     command at step N-1.
#       echo     -> status_N == cmd_{N-1}  (a lagged copy)
#       real OSR -> no such correspondence
#
#  T3 ZERO-CMD: shift command 0x000 repeatedly.
#       echo     -> status collapses to 0 after one step
#       real OSR -> status keeps reporting live state (e.g. MCLK bit set)
#
#  T4 CONTROL: IDCODE before and after, to prove the link stayed sane.
#
# This matters because §6.7's whole "command path works, data path dead" split
# rests on those status values being genuine.
#
# Run:
#   openocd -f work/jtag/once_echo_test.cfg

adapter driver cmsis-dap
transport select jtag
adapter speed 1000

jtag newtap mpc5607b cpu -irlen 5 -expected-id 0x4ae43041

init

proc sel_once {} { irscan mpc5607b.cpu 0x11 -endstate IDLE }
proc cmd {c} { return [drscan mpc5607b.cpu 10 $c -endstate IDLE] }

echo ""
echo "=== T4a CONTROL: IDCODE before ==="
irscan mpc5607b.cpu 0x01 -endstate IDLE
echo "   IDCODE = [drscan mpc5607b.cpu 32 0 -endstate IDLE]"

echo ""
echo "=== T1 REPEAT: same command (0x200) five times ==="
sel_once
foreach i {1 2 3 4 5} {
    echo "   send 0x200 -> status [cmd 0x200]"
}

echo ""
echo "=== T2 TRACK: distinct commands in sequence ==="
echo "    (if status_N == cmd_(N-1), it is an ECHO)"
sel_once
foreach c {0x200 0x202 0x212 0x210 0x07e 0x155 0x2aa} {
    echo [format "   send %-6s -> status %s" $c [cmd $c]]
}

echo ""
echo "=== T3 ZERO-CMD: shift 0x000 repeatedly ==="
sel_once
foreach i {1 2 3 4} {
    echo "   send 0x000 -> status [cmd 0x000]"
}

echo ""
echo "=== T2b TRACK again with a distinctive pattern ==="
sel_once
foreach c {0x3ff 0x000 0x3ff 0x000 0x2aa 0x155} {
    echo [format "   send %-6s -> status %s" $c [cmd $c]]
}

echo ""
echo "=== T4b CONTROL: IDCODE after ==="
irscan mpc5607b.cpu 0x01 -endstate IDLE
echo "   IDCODE = [drscan mpc5607b.cpu 32 0 -endstate IDLE]  (want 4ae43041)"
echo "=== done ==="
shutdown
