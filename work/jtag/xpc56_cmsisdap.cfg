# BCM bench #2 (MPC5607B / e200z0) via CMSIS-DAP, using the calandoa xpc56 fork.
#
# WHY A FORK: stock OpenOCD 0.12 has no PowerPC e200 target and, more
# fundamentally, cannot hold an auxiliary-TAP transaction across two DR scans -
# it hardcodes SHIFT-DR -> EXIT1 -> PAUSE, and on MPC56xx passing through
# DR-PAUSE hands control back to the JTAGC, tearing down the OnCE sequence
# mid-transaction.  Measured proof of that failure is in docs/jtag_bringup.md 6.
# calandoa/openocd implements a real `xpc56` target for e200z0.
#
# NOTE ON SYNTAX: this fork is based on an older OpenOCD, so it uses the legacy
# `interface` / `adapter_khz` commands.  `adapter driver ...` does NOT exist
# here and produces "invalid command name adapter".
#
# TAP ID: the fork's own xpc56.cfg lists
#     0x3ae44041  SPC560D
#     0x3ae41041  SPC560B   (commented out)
# Our bench unit reports 0x4AE43041.  Same 0xAE4x family, differing in the
# version nibble [31:28] (4 vs 3) and the part low nibble.  We therefore declare
# OUR measured ID rather than either of theirs.
#
# Run:
#   work/jtag/openocd-xpc56/src/openocd -f work/jtag/xpc56_cmsisdap.cfg

interface cmsis-dap
cmsis_dap_vid_pid 0x2e8a 0x000c

transport select jtag

# Start conservative; the link was proven stable to 15 MHz on raw scans, but a
# real target driver does far more traffic, so prove it slow first.
adapter_khz 1000

set CHIPNAME mpc5607b
# Little-endian is what the fork's own config uses ("big endian, but allow to
# read memory directly") - keep their convention.
set ENDIAN little
set CPUTAPID 0x4ae43041

jtag newtap $CHIPNAME cpu -irlen 5 -expected-id $CPUTAPID
set TARGETNAME $CHIPNAME.cpu

target create $TARGETNAME xpc56 -endian $ENDIAN -chain-position $TARGETNAME

# Flash banks are declared by the fork's config; we deliberately do NOT declare
# them yet.  This bench unit is a working ECU - a flash driver that probes or
# erases on init is an unnecessary risk while we are only trying to read.
# Add them later if flash access is actually wanted.

init
