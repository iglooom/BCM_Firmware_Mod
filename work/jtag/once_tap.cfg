# Reach the e200z0 OnCE TAP correctly.
#
# ⚠ CORRECTION to work/jtag/nexus_probe.cfg: the client-select opcodes there
# were WRONG.  Per NXP AN4365 Table 2 (authoritative, and explicitly "the same
# on all MPC56xx devices"):
#
#     0b10000 = 0x10  ACCESS_AUX_TAP_NPC    (Nexus Port Controller)
#     0b10001 = 0x11  ACCESS_AUX_TAP_ONCE   (e200 OnCE)          <-- !!
#     0b10010 = 0x12  ACCESS_AUX_TAP_eTPU
#
# nexus_probe.cfg labelled 0x10 as ONCE (it is NPC) and 0x11 as NEXUS (it is
# ONCE).  So the earlier "OnCE does not respond" was probing the wrong opcode,
# and the structured constant 0x07C1C01D measured at IR 0x11 came FROM THE OnCE
# TAP.  The OnCE TAP was answering all along.
#
# THE HARD PART (documented on the openocd-devel list, 2017):
# after ACCESS_AUX_TAP_ONCE the auxiliary TAP takes over the pins and its IR is
# 10 BITS WIDE, not 5.  OpenOCD's jtag layer only supports a statically declared
# IR length per TAP, so `irscan` will emit 5 bits and corrupt the transaction.
# Worse, entering DR-PAUSE hands control back to the JTAGC.
#
# WORKAROUND USED HERE: declare the TAP with irlen 10 and drive the 5-bit JTAGC
# select as raw bits, or exploit that after a TAP reset the JTAGC is selected
# again.  We test both directions and report honestly which (if either) works.
#
# Run: openocd -f work/jtag/once_tap.cfg

adapter driver cmsis-dap
transport select jtag
adapter speed 1000

jtag newtap mpc5607b cpu -irlen 5 -expected-id 0x4ae43041
init

# e200z0 OnCE register addresses (RS field of OCMD), from the e200z0 core RM:
#   0x00 = reserved/NOP    0x01 = JTAG_ID (OnCE)
#   0x10 = DBCR0  0x11 = DBCR1  0x12 = DBCR2  0x14 = DBSR
#   0x1F = BYPASS 0x62 = OSR   0x6F = NOP/"no register"
# OCMD layout (10 bits): [9]=R/W [8]=GO [7]=EX [6:0]=RS

proc once_select {} {
    # Select the OnCE auxiliary TAP.  AN4365 2.1.
    irscan mpc5607b.cpu 0x11
}

proc raw_dr {bits val} {
    return [drscan mpc5607b.cpu $bits $val]
}

proc show {label val} {
    echo [format "   %-28s 0x%s" $label $val]
}

echo "==== A. JTAGC IDCODE (baseline, must still work) ===="
irscan mpc5607b.cpu 0x01
show "JTAGC IDCODE" [raw_dr 32 0]

echo ""
echo "==== B. select OnCE, then read whatever the DR gives at several widths ===="
foreach w {4 8 10 16 32} {
    once_select
    show "OnCE DR width $w" [raw_dr $w 0]
}

echo ""
echo "==== C. does the OnCE DR value depend on DR WIDTH? ===="
echo "   If the same constant appears at every width, we are still reading the"
echo "   JTAGC's own register and the aux TAP never took over."
echo "   If the value CHANGES with width, the aux TAP is shifting real data."

echo ""
echo "==== D. try an OCMD (10-bit) then a 32-bit data pass ===="
echo "   OCMD 0x062 = read OSR ; 0x001 = read OnCE JTAG_ID"
foreach {name ocmd} {OSR 0x062 ONCE_JTAG_ID 0x001 DBSR 0x014} {
    once_select
    # 10-bit OCMD shifted as a DR of the (now active) OnCE TAP
    raw_dr 10 $ocmd
    show "after OCMD $name" [raw_dr 32 0]
}

shutdown
