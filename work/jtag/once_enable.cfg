# Does OnCE need an ENABLE before its data registers return anything?
#
# ESTABLISHED SO FAR:
#   * transport healthy     - IDCODE correct at 32..256-bit scans, 192 included
#   * NOT censored          - NVSCC0/1 = 0x55AA55AA read from THIS device's shadow
#   * fork exonerated       - stock OpenOCD reproduces the same zeros
#   * OnCE command/status path WORKS - command scans return 0x1D / 0x04 / 0x24 /
#     0x20, and OSR tracked 0x221 <-> 0x201 across debug entry/exit
#   * NO OnCE data register has EVER returned non-zero
#
# HYPOTHESIS: data registers stay at zero until the OnCE module is enabled
# (EN_ONCE, command 0x7E) and/or OCR is configured. The fork does exactly that
# in xpc56_debug_enter():  EN_ONCE -> OCR = BIT(2)|BIT(1)|BIT(0) -> DBCR0.
#
# DESIGN - a within-run A/B with the order deliberately fixed:
#   A. read DBCR0/DBSR/CPUSCR with NO enable            (expect zeros)
#   B. send EN_ONCE, then read the same registers       (does anything change?)
#   C. send EN_ONCE + OCR, then read again              (full fork sequence)
#   D. re-read IDCODE at the end                        (control: link still sane)
#
# If B or C yields ANY non-zero data -> enable/sequencing is the missing step.
# If all stay zero while D still passes -> the enable is not the issue, and the
# next suspect is the DR-PAUSE teardown documented in section 4.1.
#
# ⚠ SCOPE NOTE (rule 18): this config declares NO target, so stock OpenOCD
# cannot halt the core - a null result here is a claim about the SCAN path
# only, with the CPU running. The fork's zeros were observed on a HALTED core,
# which is a different precondition; that difference is itself a variable and
# is called out in the output rather than glossed over.
#
# Run:
#   openocd -f work/jtag/once_enable.cfg

adapter driver cmsis-dap
transport select jtag
adapter speed 1000

jtag newtap mpc5607b cpu -irlen 5 -expected-id 0x4ae43041

init

proc sel_once {} {
    irscan mpc5607b.cpu 0x11 -endstate IDLE
}

# Shift a 10-bit OnCE command, return the status captured during that scan.
proc once_cmd {c} {
    return [drscan mpc5607b.cpu 10 $c -endstate IDLE]
}

proc rd {label cmd width} {
    set st [once_cmd $cmd]
    set d  [drscan mpc5607b.cpu $width 0 -endstate IDLE]
    set nz 0
    if {[string trim $d "0"] ne ""} { set nz 1 }
    echo [format "   %-16s cmd=0x%03x status=%s data=%s %s" \
          $label $cmd $st $d [expr {$nz ? "<== NON-ZERO" : ""}]]
}

echo ""
echo "=== A. no enable ==="
sel_once
rd "DBCR0"  0x200 32
rd "DBSR"   0x202 32
rd "CPUSCR" 0x210 192

echo ""
echo "=== B. after EN_ONCE (0x7E) ==="
sel_once
echo "   EN_ONCE status=[once_cmd 0x07e]"
rd "DBCR0"  0x200 32
rd "DBSR"   0x202 32
rd "CPUSCR" 0x210 192

echo ""
echo "=== C. after EN_ONCE + OCR=0x7 (fork's debug_enter sequence) ==="
sel_once
echo "   EN_ONCE status=[once_cmd 0x07e]"
echo "   OCR wr  status=[once_cmd 0x012]"
drscan mpc5607b.cpu 32 0x00000007 -endstate IDLE
rd "OCR readback" 0x212 32
rd "DBCR0"  0x200 32
rd "DBSR"   0x202 32
rd "CPUSCR" 0x210 192

echo ""
echo "=== D. CONTROL: IDCODE still correct? ==="
irscan mpc5607b.cpu 0x01 -endstate IDLE
echo "   IDCODE = [drscan mpc5607b.cpu 32 0 -endstate IDLE]  (want 4ae43041)"
echo "=== done ==="
shutdown
