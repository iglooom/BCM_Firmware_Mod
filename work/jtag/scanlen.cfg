# Does the fork's OLD cmsis-dap driver break on LONG DR scans?
#
# Evidence pointing here:
#   * 32-bit scans work      - OSR reads 0x221/0x201, tracking debug enter/exit
#   * 192-bit CPUSCR scan    - returns ALL ZEROS, including the IR field that
#                              WE JUST WROTE.  A write-then-readback of our own
#                              value cannot legitimately be zero.
#
# Test: shift a pattern through BYPASS (1-bit register) at increasing lengths.
# Ground truth is arithmetic, not silicon-dependent: out == (in << 1), because
# BYPASS delays by exactly one TCK.  Any length where that fails is a driver
# bug, not a target property.
#
# Run with BOTH binaries and compare:
#   work/jtag/openocd-xpc56/src/openocd -f work/jtag/xpc56_hid.cfg -f work/jtag/scanlen.cfg
#   openocd -f <stock v2-style cfg> -f work/jtag/scanlen.cfg

proc bit_test {len inhex} {
    irscan mpc5607b.cpu 0x1F
    set out [drscan mpc5607b.cpu $len $inhex]
    set inv  [expr {"0x$inhex"}]
    set outv [expr {"0x$out"}]
    set mask [expr {(1 << $len) - 1}]
    set expect [expr {($inv << 1) & $mask}]
    if {$outv == $expect} {
        echo [format "   %3d bits: in=%s out=%s  OK (== in<<1)" $len $inhex $out]
    } else {
        echo [format "   %3d bits: in=%s out=%s  *** MISMATCH, expected %x ***" $len $inhex $out $expect]
    }
}

echo ""
echo "=== BYPASS shift test at increasing DR lengths ==="
echo "    (ground truth: out must equal in<<1 at every length)"
bit_test 8   5A
bit_test 16  5A5A
bit_test 32  5A5A5A5A
bit_test 64  5A5A5A5A5A5A5A5A
bit_test 96  5A5A5A5A5A5A5A5A5A5A5A5A
bit_test 128 5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A
bit_test 192 5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A5A
echo "=== done ==="
exit
