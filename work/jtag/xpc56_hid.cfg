# BCM bench #2 (MPC5607B / e200z0) via CMSIS-DAP **v1 / HID**, calandoa xpc56 fork.
#
# Use this ONLY after flashing work/jtag/firmware/JTAGprobe-pico2-CMSIS-DAPv1-HID.uf2.
# With the stock v2 firmware the fork prints "unable to find CMSIS-DAP device",
# because its driver is HID-only (2 hidapi calls, 0 libusb/bulk) while the v2
# probe exposes only a bulk interface.  See docs/jtag_bringup.md §5.
#
# SYNTAX: this fork is based on an older OpenOCD - it uses the legacy
# `interface` / `adapter_khz` commands.  `adapter driver ...` does NOT exist
# here and errors with "invalid command name adapter".
#
# TAP ID: the fork's own xpc56.cfg ships
#     0x3ae44041  SPC560D
#     0x3ae41041  SPC560B  (commented out)
# Our bench unit measures 0x4AE43041 - same 0xAE4x family, different version
# nibble.  We declare OUR measured value; anything else will fail the check.
#
# Run:
#   work/jtag/openocd-xpc56/src/openocd -f work/jtag/xpc56_hid.cfg

interface cmsis-dap
cmsis_dap_vid_pid 0x2e8a 0x000c

transport select jtag

# Conservative first.  Raw scans were stable to 15 MHz, but a real target driver
# generates far more traffic and HID is slower per packet than bulk.
adapter_khz 1000

set CHIPNAME mpc5607b
set ENDIAN little
set CPUTAPID 0x4ae43041

jtag newtap $CHIPNAME cpu -irlen 5 -expected-id $CPUTAPID
set TARGETNAME $CHIPNAME.cpu

target create $TARGETNAME xpc56 -endian $ENDIAN -chain-position $TARGETNAME

# ⚠ NO `flash bank` LINES ON PURPOSE.
# The fork's xpc56.cfg declares two flash banks and some flash drivers probe or
# unlock on init.  This is a working ECU on the bench; while we are only trying
# to READ, a flash driver touching the part is gratuitous risk.  Add banks later
# and deliberately, if flash access is actually wanted.

init
