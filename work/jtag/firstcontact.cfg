# First-contact JTAG config: Lonehog/Raspberry Pi "JTAG probe on Pico" (CMSIS-DAP v2)
#   -> Ford BCM bench unit, MPC5607B (Bolero family, e200z0 core)
#
# PURPOSE: prove the electrical/protocol link only.  This config deliberately
# does NOT try to create a target, because OpenOCD has NO PowerPC e200 target
# support (see docs/jtag_bringup.md).  All it does is interrogate the JTAG scan
# chain and print whatever IDCODE comes back.
#
# Probe: USB 2e8a:000c, CMSIS-DAP v2 (bulk EP4 OUT / EP5 IN), plus a CDC-ACM
# UART on interface 1-2.  v2 = bulk, so the usb_bulk backend is required; the
# hid backend will not find it.
#
# MPC560xB JTAG facts used here:
#   * JTAGC instruction register is 5 bits wide.
#   * IDCODE opcode 0x01, BYPASS 0x1F.
#   * The JCOMP pin MUST be asserted (high) or the TAP is held in reset and the
#     chain reads back as all-ones.  On a production ECU board JCOMP is very
#     often pulled low - that is the single most likely reason for a dead scan.
#   * Censorship: if the flash is censored, the debug interface can be disabled
#     entirely.  A dead chain is therefore NOT proof of bad wiring.
#
# Run:  openocd -f work/jtag/firstcontact.cfg

adapter driver cmsis-dap
cmsis-dap backend usb_bulk
cmsis-dap vid_pid 0x2e8a 0x000c

transport select jtag

# Start slow.  Long ECU harness leads are not transmission lines; 100 kHz is a
# conservative first attempt.  Raise only after a stable IDCODE.
adapter speed 100

# Declare a single 5-bit TAP.  -expected-id 0 means "accept anything and tell me
# what you saw", which is what we want for a first contact.
jtag newtap mpc5607b cpu -irlen 5 -expected-id 0

# Do not try to halt/examine anything - there is no e200 target driver.
init
echo "---- scan chain ----"
scan_chain
echo "---- tap status ----"
jtag names
echo "---- raw IDCODE via drscan (TAP in RESET selects IDCODE) ----"
# After a TAP reset the IDCODE instruction is loaded automatically, so a plain
# 32-bit DR shift returns the device ID without needing an IR scan first.
irscan mpc5607b.cpu 0x01
set id [drscan mpc5607b.cpu 32 0]
echo "IDCODE = 0x$id"
shutdown
