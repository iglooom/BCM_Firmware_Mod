# Attempt a real OnCE transaction: OCMD (10-bit) + data pass.
#
# Context: work/jtag/once_tap.cfg proved the OnCE TAP is reachable at
# IR 0x11 (ACCESS_AUX_TAP_ONCE per AN4365) and that its DR is a real shift
# register - reading it at 4/8/10/16/32 bits returns successively more of the
# same value 0x07C1C01D, LSB-first, exactly as a genuine DR would.
#
# What failed there: shifting a 10-bit OCMD and then a 32-bit data pass returned
# all zeros.  Per the openocd-devel thread on xPC56 support, that is expected -
# after the aux TAP is selected its IR is 10 bits wide, but OpenOCD only ever
# emits the statically declared 5 bits, and passing through DR-PAUSE hands
# control back to the JTAGC mid-sequence.
#
# This file probes the boundary of what stock OpenOCD can do: whether repeated
# selects change state, and whether any OCMD encoding produces a non-zero data
# pass.  A null result here is a statement about OPENOCD, not about the silicon.
#
# OCMD layout (10 bits): [9]=R/W  [8]=GO  [7]=EX  [6:0]=RS
#   RS 0x02 = OnCE JTAG_ID, 0x62 = OSR, 0x14 = DBSR
#   R/W=1 (read) sets bit 9 -> +0x200
#
# Run: openocd -f work/jtag/once_ocmd.cfg

adapter driver cmsis-dap
transport select jtag
adapter speed 1000

jtag newtap mpc5607b cpu -irlen 5 -expected-id 0x4ae43041
init

echo "==== A. baseline: select OnCE, read DR ===="
irscan mpc5607b.cpu 0x11
echo "   DR(32) = 0x[drscan mpc5607b.cpu 32 0]"

echo ""
echo "==== B. repeated selects - does the value change with TAP state? ===="
foreach i {1 2 3} {
    irscan mpc5607b.cpu 0x11
    echo "   pass$i = 0x[drscan mpc5607b.cpu 32 0]"
}

echo ""
echo "==== C. OCMD then data pass, several encodings ===="
echo "   (a non-zero data value would mean the OnCE accepted the command)"
foreach ocmd {0x002 0x202 0x062 0x262 0x014 0x214 0x001 0x201} {
    irscan mpc5607b.cpu 0x11
    set ack [drscan mpc5607b.cpu 10 $ocmd]
    set dat [drscan mpc5607b.cpu 32 0]
    echo "   OCMD $ocmd -> ack 0x$ack  data 0x$dat"
}

echo ""
echo "==== D. control: same data pass with NO OCMD ===="
irscan mpc5607b.cpu 0x11
echo "   no-OCMD data = 0x[drscan mpc5607b.cpu 32 0]"
echo "   (if C and D agree, the OCMD had no effect at all)"

exit
