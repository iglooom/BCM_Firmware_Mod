# Probe the MPC5607B Nexus/OnCE TAPs beyond IDCODE.
#
# The IDCODE proves the JTAGC (JTAG Controller) TAP answers.  That alone does
# NOT tell us whether DEBUG is usable: on MPC560xB the censorship word in the
# shadow flash can disable the Nexus debug interface while leaving the boundary-
# scan/JTAGC TAP perfectly responsive.  So a healthy IDCODE + a dead OnCE is the
# exact signature of a censored part, and is the single most important thing to
# establish before investing in a debug workflow.
#
# What this does:
#   * enumerate every 5-bit IR opcode and record which ones change the DR length
#     (a crude but honest IR map - we cannot halt the core, so we look at the
#     scan-chain behaviour instead)
#   * specifically try ACCESS_AUX_TAP_ONCE (0x10) and ACCESS_AUX_TAP_NEXUS
#     (0x11), the documented MPC560xB opcodes that switch the chain over to the
#     e200z0 OnCE / Nexus TAPs
#   * read the OnCE OSR (status register) if the OnCE TAP responds
#
# Run: openocd -f work/jtag/bcm_mpc5607b.cfg -f work/jtag/nexus_probe.cfg

proc drlen_for_ir {ir} {
    # Shift a long run of ones in, then a long run of zeros, and see how many
    # bits of delay appear.  Works without knowing the DR length in advance.
    irscan mpc5607b.cpu $ir
    set a [drscan mpc5607b.cpu 32 0xFFFFFFFF]
    set b [drscan mpc5607b.cpu 32 0x00000000]
    return "$a/$b"
}

proc ir_map {} {
    echo "---- IR opcode map (5-bit IR, 32-bit DR probe) ----"
    echo "   ir   DR(ones)/DR(zeros)     note"
    for {set ir 0} {$ir < 32} {incr ir} {
        set r [drlen_for_ir $ir]
        set note ""
        if {$ir == 0x01} { set note "IDCODE" }
        if {$ir == 0x02} { set note "SAMPLE/PRELOAD" }
        if {$ir == 0x10} { set note "ACCESS_AUX_TAP_ONCE" }
        if {$ir == 0x11} { set note "ACCESS_AUX_TAP_NEXUS" }
        if {$ir == 0x1F} { set note "BYPASS" }
        echo [format "   0x%02X %-24s %s" $ir $r $note]
    }
}

proc try_once_tap {} {
    echo ""
    echo "---- switching to the OnCE auxiliary TAP (IR 0x10) ----"
    echo "   *** THIS PROBE IS INVALID - DO NOT READ A VERDICT FROM IT ***"
    echo "   After ACCESS_AUX_TAP_ONCE the chain switches to the e200z0 OnCE"
    echo "   TAP, whose IR is 10 BITS WIDE.  OpenOCD is still driving the"
    echo "   statically declared 5-bit JTAGC TAP, so a 32-bit DR scan here is"
    echo "   not a valid OnCE transaction.  An all-zeros result therefore says"
    echo "   NOTHING about censorship (AGENTS.md rule 8)."
    echo "   Kept only to document the attempt; see docs/jtag_bringup.md 4."
    irscan mpc5607b.cpu 0x10
    set osr [drscan mpc5607b.cpu 32 0x00000000]
    echo "   raw DR after OnCE select: 0x$osr  (UNINTERPRETABLE, see above)"
}
